# Coolify deployment.
#   New Resource → your Git repository → Build Pack: Docker Compose
#   Docker Compose Location: /docker-compose.coolify.yml
#
# Coolify's proxy terminates HTTPS and routes the domain you give the `web`
# service to its port 80 — nothing here publishes a host port, and there is
# no .env file: every ${VARIABLE} below appears in Coolify's Environment
# Variables tab. Required: APP_ENCRYPTION_KEY (openssl rand -hex 32) and
# SUPERADMIN_PASSWORD. The Postgres password is generated by Coolify.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-vici_qa}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-vici_qa}
  REDIS_URL: redis://redis:6379
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  # false = automatic: the cookie is Secure whenever the site is served over HTTPS
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@example.com}
  SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
  SEED_DEMO: ${SEED_DEMO:-false}
  RETENTION_DAYS: ${RETENTION_DAYS:-7}
  SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-60}
  SYNC_LOOKBACK_MINUTES: ${SYNC_LOOKBACK_MINUTES:-15}
  SYNC_HISTORICAL_DAYS: ${SYNC_HISTORICAL_DAYS:-30}
  RECORDING_CHECK_SECONDS: ${RECORDING_CHECK_SECONDS:-60}
  RECORDING_RETRY_MINUTES: ${RECORDING_RETRY_MINUTES:-10}
  MATCH_AUTO_THRESHOLD: ${MATCH_AUTO_THRESHOLD:-70}
  MATCH_FLAG_THRESHOLD: ${MATCH_FLAG_THRESHOLD:-40}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vici_qa}
      POSTGRES_USER: ${POSTGRES_USER:-vici_qa}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vici_qa} -d ${POSTGRES_DB:-vici_qa}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./server
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      # tells Coolify this is the public service, on container port 80;
      # set the real domain on this service in the Coolify UI
      - SERVICE_FQDN_WEB_80
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  redisdata:
