name: vici-qa

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app-env: &app-env
  # the API always listens on 8080 inside its container; API_PORT in .env
  # only picks the host port it is published on
  API_PORT: "8080"
  DATABASE_URL: postgres://${POSTGRES_USER:-vici_qa}:${POSTGRES_PASSWORD:-change-me-strong-password}@postgres:5432/${POSTGRES_DB:-vici_qa}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vici_qa}
      POSTGRES_USER: ${POSTGRES_USER:-vici_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    # Tuned for an SSD server shared with the app (defaults are sized for a
    # tiny machine). Raise PG_SHARED_BUFFERS to ~25% of RAM on bigger boxes.
    # pg_stat_statements records the slowest queries for diagnosis.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=${PG_LOG_SLOW_MS:-2000}
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vici_qa} -d ${POSTGRES_DB:-vici_qa}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build:
      context: ./server
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    env_file: .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # the web container proxies /api internally; expose the API itself only
    # on localhost (set API_BIND=0.0.0.0 to reach it from other machines)
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  worker:
    build:
      context: ./server
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    # WEB_BIND=127.0.0.1 when a TLS proxy (docker-compose.https.yml) fronts it
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging

volumes:
  pgdata:
  redisdata:
