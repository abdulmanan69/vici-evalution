server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress pages, scripts and API JSON (queue lists shrink ~6x). "any"
    # also compresses when the request came through a proxy such as Coolify's.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Docker's embedded DNS - re-resolve `api` so backend restarts don't 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # API + authenticated recording streams go to the backend
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # recording streams: pass Range chunks through
        proxy_request_buffering off;
        client_max_body_size 5m;
    }

    location = /healthz {
        proxy_pass $api_upstream;
    }

    # Build files carry a content hash in their name and never change:
    # browsers keep them for a year and skip even the revalidation request.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The app shell is always re-checked, so a deploy reaches everyone at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
