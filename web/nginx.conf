server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS — re-resolve `api` so backend restarts don't 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # API + authenticated recording streams go to the backend
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # recording streams: pass Range chunks through
        proxy_request_buffering off;
        client_max_body_size 5m;
    }

    location = /healthz {
        proxy_pass $api_upstream;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
